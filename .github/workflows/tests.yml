name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The T113 runs Python 3.9; the host side runs on current Debian.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pytest
      - run: python -m pytest -q tests
      - run: bash -n build-slot-b.sh install-slot-b.sh
